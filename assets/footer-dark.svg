<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Need a Flutter lead on your team? Book a call</title><desc id="d">Get in touch with your context and timeline. contact@devlopn.com · cal.com/devlopn</desc><style>@font-face{font-family:DevlopnSans;font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DevlopnMono;font-weight:100 800;src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:DevlopnSans,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:DevlopnMono,'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
